<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation Form</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Registration Form</h1>
        <p class="subtitle">Please fill in the form below</p>

        <form id="registrationForm">

            <!-- Full Name -->
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="Enter your full name">
                <small class="error" id="nameError"></small>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="text" id="email" placeholder="example@email.com">
                <small class="error" id="emailError"></small>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Minimum 6 characters">
                <small class="error" id="passwordError"></small>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm your password">
                <small class="error" id="confirmPasswordError"></small>
            </div>

            <!-- Phone -->
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="text" id="phone" placeholder="Enter phone number">
                <small class="error" id="phoneError"></small>
            </div>

            <!-- Gender -->
            <div class="form-group">
                <label>Gender</label>

                <div class="radio-group">
                    <label>
                        <input type="radio" name="gender" value="Male">
                        Male
                    </label>

                    <label>
                        <input type="radio" name="gender" value="Female">
                        Female
                    </label>
                </div>

                <small class="error" id="genderError"></small>
            </div>

            <!-- Hobbies -->
            <div class="form-group">
                <label>Hobbies / Interests</label>

                <div class="checkbox-group">

                    <label>
                        <input type="checkbox" name="hobby" value="Sports">
                        Sports
                    </label>

                    <label>
                        <input type="checkbox" name="hobby" value="Music">
                        Music
                    </label>

                    <label>
                        <input type="checkbox" name="hobby" value="Shopping">
                        Shopping
                    </label>

                    <label>
                        <input type="checkbox" name="hobby" value="Traveling">
                        Traveling
                    </label>

                    <label>
                        <input type="checkbox" name="hobby" value="Drawing">
                        Drawing
                    </label>

                </div>

                <small class="error" id="hobbyError"></small>
            </div>

            <!-- Country -->
            <div class="form-group">
                <label for="country">Country</label>

                <select id="country">
                    <option value="">-- Select Country --</option>
                    <option value="Indonesia">Indonesia</option>
                    <option value="Korea">Korea</option>
                    <option value="Singapore">Singapore</option>
                    <option value="Thailand">Thailand</option>
                    <option value="Japan">Japan</option>
                    <option value="China">China</option>
                </select>

                <small class="error" id="countryError"></small>
            </div>

            <!-- Submit -->
            <button type="submit">Register</button>

            <p id="successMessage"></p>

        </form>

    </div>

    <script src="script.js"></script>

</body>
</html>
